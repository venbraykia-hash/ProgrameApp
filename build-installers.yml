name: Build APK and Windows Installer

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Venbrayk-Process-App-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Venbrayk-Process-Android
          path: Venbrayk-Process-App-v0.1.0.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish controller
        run: dotnet publish windows-controller/Venbrayk.Process.Controller.csproj -c Release -o publish
      - name: Build modern installer
        run: iscc installer/VenbraykProcess.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Venbrayk-Process-Windows
          path: artifacts/Venbrayk-Process-Setup-v0.1.0.exe
